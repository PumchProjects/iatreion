[study]
name = ""
objective = "AUROC"
direction = "maximize"
n-trials = 60
sampler = "tpe"
seed = 42
n-startup-trials = 20
multivariate = true
pruner = "none"
load-if-exists = true

[execution]
trial-log-root = "logs_optuna_rrl"
fail-value = 0.0
n-jobs = 1
# study-workers = 4

[search.learning-rate]
type = "float"
low = 0.002
high = 0.01
log = true

[search.lr-decay-rate]
type = "float"
low = 0.80
high = 0.92
step = 0.01

[search.lr-decay-epoch]
type = "categorical"
choices = [100, 150, 200, 250, 300]

[search.weight-decay]
type = "categorical"
choices = [0.0, 1e-5, 1e-4, 5e-4, 1e-3, 2e-3, 5e-3]

[search.temp]
type = "float"
low = 0.02
high = 0.3
log = true

[search.structure]
type = "categorical"
choices = ["5@256", "5@512", "10@256", "10@512", "10@768", "10@1024"]

[search.coverage-tau]
type = "float"
low = 0.15
high = 0.45
step = 0.05

[search.coverage-kappa]
type = "float"
low = 0.05
high = 0.6
log = true

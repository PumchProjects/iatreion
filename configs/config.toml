[process]
names = ["h-demo", "h-mmse", "h-moca", "h-mri", "h-mri-roi", "h-plasma", "h-history", "sh-apoe-labdata"]
prefix = "<path-to-a-new-or-non-existent-folder>"
data = { harmonized = "<path-to-the-input-data-spreadsheet>" }
index-name = "ID"
group-columns = ["A", "T", "MMSE_progression_group"]

[train.rrl]
prefix = "<path-to-the-folder-storing-processed-data>"
names = ["h-demo", "h-mmse", "h-moca", "h-mri", "h-mri-roi", "h-history", "sh-apoe-labdata"]
label-name = "A"
groups = ["A+", "A-"]
positive-label = "A+"
keep = "first"
use-clinical-threshold = false
aggregate = "calibrated-fusion"
log-root = "logs"
device-id = "0-7"
val-size = 0.2
epoch = 1201
batch-size = 128
save-interval = 100
early-stop-patience = 10
early-stop-min-delta = 0.001
label-smoothing = 0.05
max-grad-norm = 3.0
nlaf = true
alpha = 0.9
beta = 3
gamma = 3
use-not = true
skip = true
weighted = true
missing-aware-mode = "original"
tune-config = "configs/optuna_rrl.toml"

[train.rrl-parser]
prefix = "<path-to-the-folder-storing-processed-data>"
names = ["h-demo", "h-mmse", "h-moca", "h-mri", "h-mri-roi", "h-history", "sh-apoe-labdata"]
label-name = "A"
groups = ["A+", "A-"]
positive-label = "A+"
keep = "first"
use-clinical-threshold = false
aggregate = "calibrated-fusion"
preprocess = false
log-root = "logs"
device-id = "0-7"

[train.result-replay]
prefix = "<path-to-the-folder-storing-processed-data>"
names = ["h-demo", "h-mmse", "h-moca", "h-mri", "h-mri-roi", "h-history", "sh-apoe-labdata"]
eval-names = ["h-demo", "h-mmse", "h-moca", "h-mri", "h-mri-roi", "h-history", "sh-apoe-labdata"]
label-name = "A"
groups = ["A+", "A-"]
positive-label = "A+"
keep = "first"
use-clinical-threshold = false
aggregate = "calibrated-fusion"
log-root = "logs"
source-model = "rrl"

[train.xgboost]
prefix = "<path-to-the-folder-storing-processed-data>"
names = ["h-demo", "h-mmse", "h-moca", "h-mri", "h-mri-roi", "h-history", "sh-apoe-labdata"]
label-name = "A"
groups = ["A+", "A-"]
positive-label = "A+"
keep = "first"
use-clinical-threshold = false
aggregate = "calibrated-fusion"
log-root = "logs"
device-id = "0-7"
device = "cuda"
tune-config = "configs/optuna_xgboost.toml"

[train.random-forest]
prefix = "<path-to-the-folder-storing-processed-data>"
names = ["h-demo", "h-mmse", "h-moca", "h-mri", "h-mri-roi", "h-history", "sh-apoe-labdata"]

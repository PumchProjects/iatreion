[study]
name = ""
objective = "AUROC"
direction = "maximize"
n-trials = 60
sampler = "tpe"
seed = 42
n-startup-trials = 20
multivariate = true
pruner = "none"
load-if-exists = true

[execution]
trial-log-root = "logs_optuna"
fail-value = 0.0
n-jobs = 1
study-workers = 4

[search.n-estimators]
type = "int"
low = 200
high = 800
step = 100

[search.max-depth]
type = "categorical"
choices = [0, 2, 3, 4, 5, 6, 8, 10, 12, 16]

[search.min-samples-leaf]
type = "int"
low = 1
high = 20

[search.min-samples-split]
type = "int"
low = 2
high = 30

[search.max-features]
type = "categorical"
choices = ["sqrt", "log2", "0.3", "0.5", "0.7", "1.0"]

[search.class-weight]
type = "categorical"
choices = ["none", "balanced", "balanced_subsample"]

[search.max-samples]
type = "float"
low = 0.6
high = 1.0
step = 0.1

[search.ccp-alpha]
type = "categorical"
choices = [0.0, 1e-4, 1e-3, 1e-2]
